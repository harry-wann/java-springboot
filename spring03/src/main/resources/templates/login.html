<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
    </head>
    <body>
    <h3>Login Page</h3>
    <hr />
    <form method="post" th:action="@{/members/login}">
        <div>
            <label>Account</label>
            <input type="text" name="account" required />
        </div>
        <div>
            <label>Password</label>
            <input type="password" name="password" required />
        </div>
        <button type="submit">Login</button>
    </form>
    <div th:if="${error}" th:text="${error}">Error message</div>
    </body>
</html>
