<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Title</title>
        <style>
            .myForm {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 4px;
            }
        </style>
    </head>
    <body>
        <h3>Register Page</h3>
        <hr />
        <form method="post" enctype="multipart/form-data" th:object="${form}" th:action="@{/members/register}">
            <div class="myForm">
                <div>
                    <label>Account</label>
                    <input type="text" required th:field="*{account}" />
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" required th:field="*{password}"/>
                </div>
                <div>
                    <label>Name</label>
                    <input type="text" required th:field="*{name}"/>
                </div>
                <div>
                    <label>Icon</label>
                    <input type="file" th:field="*{iconFile}"/>
                </div>
                <button type="submit">Register</button>
            </div>

        </form>
        <div th:if="${error}" th:text="${error}">Error message</div>
    </body>
</html>
