<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        table {
            border-collapse: collapse;
            width: 90%;
            margin: 20px;
        }
        th td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: bisque;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // 檢查 SESSION
            $.ajax({
                url: '/members/status',
                method: 'POST',
                dataType: 'json'
            }).done(function (data) {
                console.log(data);
                if (data.success) {
                    $('#companyName').text(data.companyName);
                    $('#companyTel').text(data.companyTel);
                    $('#welcome').text("Welcome " + data.member.name + "!");
                    $('#icon').attr("src", "data:image/png; base64, " + data.member.icon)
                } else {
                    location.href = "/login.html"
                }
            }).fail(function () {

            });

            // ----------------
            $('#logout').click(function () {
                $.ajax({
                    url: '/members/logout',
                    method: 'GET',
                    dataType: 'json'
                }).always(location.href = "/login.html");
            })

            // ----------------

            let nowPage = 0
            let pageSize = 10

            let totalPage = 0
            let isLast = 0

            function loadGifts(page) {
                console.log(`/gifts?page=${page}&pageSize=${pageSize}`);
                $.ajax({
                    url: `/gifts?page=${page}&pageSize=${pageSize}`,
                    method: 'GET',
                    dataType: 'json'
                }).done(function (result) {
                    console.log("Result:", result);
                    nowPage = result.page;
                    totalPage = result.totalPages;
                    isLast = result.isLast;

                    $('#page').text(`${nowPage+1} / ${totalPage+1}`);

                    let tbody = $('#giftTable tbody');
                    tbody.empty();
                    result.data.forEach((gift) => {
                        let content = `<tr>
                            <td>${gift.id}</td>
                            <td>${gift.name}</td>
                            <td>${gift.addr}</td>
                            <td>${gift.tel}</td>
                        </tr>`;
                        tbody.append(content);
                    })
                });
            }

            $('#prev').click(() => {
                if (nowPage > 0) {
                    loadGifts(nowPage-1)
                }
            });
            $('#next').click(() => {
                if (!isLast) {
                    loadGifts(nowPage+1)
                }
            });

            loadGifts(nowPage)

        });

    </script>
</head>
<body>
    <h1 id="companyName"></h1>
    <h2 id="companyTel"></h2>
    <div id="welcome">Welcome, xxx </div>
    <div><img id="icon" /></div>
    <div><button id="logout">Logout</button></div>
    <hr />
    <button id="prev">Prev</button>
    | <span id="page"></span> |
    <button id="next">Next</button>
    <hr />
    <table id="giftTable">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Tel</th>
        </thead>
        <tbody></tbody>
    </table>
</body>
</html>
