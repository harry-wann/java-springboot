<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        $(document).ready(function () {
            // 檢查 SESSION
            $.ajax({
                url: '/members/status',
                method: 'POST',
                dataType: 'json'
            }).done(function (data) {
                console.log(data);
                if (data.success) {
                    $('#companyName').text(data.companyName);
                    $('#companyTel').text(data.companyTel);
                    $('#welcome').text("Welcome " + data.member.name + "!");
                    $('#icon').attr("src", "data:image/png; base64, " + data.member.icon)
                } else {
                    location.href = "/login.html"
                }
            }).fail(function () {

            });

            // ----------------
            $('#logout').click(function () {
                $.ajax({
                    url: '/members/logout',
                    method: 'GET',
                    dataType: 'json'
                }).always(location.href = "/login.html");
            })
        });

    </script>
</head>
<body>
    <h1 id="companyName"></h1>
    <h2 id="companyTel"></h2>
    <div id="welcome">Welcome, xxx </div>
    <div><img id="icon" /></div>
    <div><button id="logout">Logout</button></div>
    <hr />
    <button id="prev">Prev</button>
    | <span id="page"></span> |
    <button id="next">Next</button>
    <hr />
    <table id="gift">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Address</th>
            <th>Tel</th>
        </thead>
        <tbody></tbody>
    </table>
</body>
</html>
