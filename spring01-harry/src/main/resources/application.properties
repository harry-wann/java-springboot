spring.application.name=spring01-harry

# 單一庫
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/harry?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root

spring.servlet.encoding.charset=UTF-8
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=64MB

server.servlet.session.timeout=30m

# 以下自訂
company.name=Big Harry Company
company.tel=001234567
name=Harry
file.upload.dir=src/main/resources/static/upload